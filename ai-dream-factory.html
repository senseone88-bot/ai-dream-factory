// ===== 圖片 URL =====
const IMG_BASE = 'https://cf.shopee.tw/file';
function imgUrl(id){return IMG_BASE+'/'+id}

// ===== 狀態 =====
let activeCat = -1; // -1 = 全部
let searchTerm = '';

// ===== DOM =====
const grid = document.getElementById('itemsGrid');
const tagsContainer = document.getElementById('tagsContainer');
const searchInput = document.getElementById('searchInput');

// ===== 渲染分類標籤 =====
function renderTags(){
  const allTag = `<span class="tag${activeCat===-1?' active':''}" data-idx="-1">📋 全部</span>`;
  const catTags = CATEGORIES.map((c,i) =>
    `<span class="tag${i===activeCat?' active':''}" data-idx="${i}">${c}</span>`
  ).join('');
  tagsContainer.innerHTML = allTag + catTags;
  
  document.querySelectorAll('.tag').forEach(el => {
    el.addEventListener('click', () => {
      activeCat = parseInt(el.dataset.idx);
      searchTerm = searchInput.value.trim().toLowerCase();
      renderTags();
      renderItems();
    });
  });
}

// ===== 渲染商品 =====
function renderItems(){
  const filtered = ITEMS.filter(item => {
    if(activeCat !== -1 && !item.cats.includes(activeCat)) return false;
    if(searchTerm && !item.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  });

  if(filtered.length === 0){
    grid.innerHTML = '<div class="no-items">😕 沒有符合的商品，試試其他關鍵字或分類</div>';
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const primaryCat = CATEGORIES[item.cats[0]];
    const link = `https://shopee.tw/product/${item.shopid}/${item.id}/`;
    return `
      <a href="${link}" target="_blank" rel="noopener" class="item-card">
        <div class="item-img-wrap">
          ${item.img ? `<img src="${imgUrl(item.img)}" alt="${item.name}" loading="lazy"
               onerror="this.parentElement.innerHTML+='<div class=img-placeholder>🤖</div>';this.style.display='none'">` 
               : `<div class="img-placeholder">🤖</div>`}
          ${item.sold > 0 ? `<span class="sold-badge">🔥 已售 ${item.sold}</span>` : ''}
          <span class="cat-badge">${primaryCat}</span>
        </div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price-row">
            <span class="item-price"><span class="currency">NT$</span> ${item.price.toLocaleString()}</span>
            <span class="item-link-hint">前往蝦皮 ↗</span>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

// ===== 搜尋 =====
searchInput.addEventListener('input', () => {
  searchTerm = searchInput.value.trim().toLowerCase();
  renderItems();
});

// ===== 初始化 =====
renderTags();
renderItems();
</script>
